[vram]
reserve_gb=3
dynamic_vram=1
; (правка) Загрузка больших моделей (~20 ГБ): 0 = синхронно (стабильно, по
; умолчанию; обходит баг comfy-aimdo 0.4.13 «hostbuf_file_reader_read failed»
; на Windows + NVIDIA), 1 = async-офлоад (быстрее загрузка, но на RTX 50xx
; может падать с GetOverlappedResult 1450/1453).
async_offload=0

vram_headroom=0
[comfy]
turbo_lora=
; (правка 148) Основная diffusion-модель: FastVideo VSA DataFree 1300-step 4-step int8 convrot.
; Пустое значение = дефолт из кода (minimax_h3_fastvideo_vsa_datafree_1300step_4step_int8_convrot.safetensors).
; ВАЖНО: имя файла в поле должно совпадать с тем, что лежит в
; ComfyUI\models\diffusion_models\ — иначе ComfyUI не найдёт модель.
diffusion_model=
; По умолчанию используется ComfyUI-Easy-Install в корне проекта.
; Раскомментируйте comfy_dir, чтобы задать другой backend для Web UI,
; start.bat и Electron (относительный путь считается от корня проекта):
; comfy_dir=ComfyUI-Easy-Install


[llm]
custom_mmproj_path=
custom_model_path=
repeat_penalty=1
frequency_penalty=0
presence_penalty=0
min_p=0.05
top_k=40
top_p=0.95
temperature=0.7
sampling_override=0
kv_cache=q4_0
video_vision=0
model=Qwen3.5-9B-Q4_K_M.gguf
max_output_tokens=4096
; (правка 119) дефолт — 25K токенов
context_size=25600
device=auto

[ui]
sound_on=1

[stt]
dir=
threads=0
language=ru
model=
enabled=1

[upscale]
; (правка 74) Вкладка Upscale — встроенный DLSS 5 Visual Enhancer (upscale/).
enabled=1
; Порт DLSS-моста (bridge.py). 7860 занят другими сервисами, используем 7890.
port=7890

[models]
extra_paths=[]

; (правка 386) Формат сохранения видео — применяется во всех режимах студии.
; codec: h264 (совместимость) | h265 (компактнее) | nvenc_h264 | nvenc_h265 (GPU)
; crf: качество программных кодеков, 0-30 (меньше = лучше; 12 = максимум)
; nvenc_bitrate: битрейт NVENC, Мбит/с (для nvenc_* кодеков)
[video]
codec=h264
crf=12
nvenc_bitrate=16
