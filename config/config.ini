[vram]
; (правка 1131, 1141) Дефолт под 8–12 ГБ: 2 ГБ системе + 1 ГБ headroom (всего 3).
; (правка 1131) headroom больше не дублируется в простом бюджете aimdo —
; он уходит только per-device, поэтому «reserve 1 + headroom 1» = ровно 2 ГБ.
; (правка 1141) Тест на 12 ГБ: без headroom Refine «Частями» забивал VRAM
; до предела и aimdo зависал; с headroom=1 проходит. Это не запас «на всякий»,
; а условие, при котором у aimdo остаются страницы для fault'ов.
reserve_gb=2
dynamic_vram=1
; 0 = синхронная загрузка моделей (стабильно), 1 = async-офлоад
async_offload=0
; (правка 1119) host-кэш весов: 0 = как в V6 — меньше занятой RAM и без падений
; 1450/1453 на pinned-аллокациях; 1 = включён (только если модель не грузится)
pinned_memory=0
; (правка 1077) nvml_pressure: 1 = aimdo учитывает, сколько VRAM реально занято
; чужими процессами (браузер, рабочий стол, DLSS). 0 = веса получают больше карты;
; на 8–12 ГБ с H3 стоит попробовать, если генерация встает на инициализации
nvml_pressure=1
; (правка 1141) 1 ГБ headroom — обязательный запас: полная VRAM без него
; вешает aimdo на переполнении. Меньше 1 не ставить; больше — только если
; на карте много свободной памяти.
vram_headroom=1
; auto = ComfyUI сам решает; 1 = принудительный --fast-disk; 0 = --disable-fast-disk
fast_disk=auto

[comfy]
turbo_lora=
; Пусто = дефолтная diffusion-модель из кода
diffusion_model=
; comfy_dir не задан = ./ComfyUI рядом с программой (старая папка ComfyUI-Easy-Install подхватывается автоматически)

[llm]
custom_mmproj_path=
custom_model_path=
repeat_penalty=1
frequency_penalty=0
presence_penalty=0
min_p=0.05
top_k=40
top_p=0.95
temperature=0.7
sampling_override=0
kv_cache=q4_0
video_vision=0
model=Qwen3.5-9B-Q4_K_M.gguf
max_output_tokens=4096
context_size=25600
device=auto

[ui]
sound_on=1
; (правка 1133) живое превью шагов во всех режимах; 0 = выключить совсем
live_preview=1

[stt]
dir=
threads=0
language=ru
model=
enabled=1

[upscale]
enabled=1
port=7890

[models]
extra_paths=[]

[video]
codec=h264
crf=12
nvenc_bitrate=16
