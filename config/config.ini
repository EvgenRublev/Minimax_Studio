[vram]
reserve_gb=4
dynamic_vram=1
; 0 = синхронная загрузка моделей (стабильно), 1 = async-офлоад
async_offload=0
; (правка 1119) host-кэш весов: 0 = выключен, как в V6 (0.33 + aimdo 0.4.13):
; меньше занятой RAM и нет падений 1450/1453 при аллокации pinned-буферов.
; 1 = включён (может ускорить перечитывание весов на 0.44, но на 16 ГБ RAM
; и на старом ядре чаще вредит). Менять только с перезапуском ComfyUI.
pinned_memory=0
; (правка 1077) nvml_pressure: 1 = aimdo учитывает, сколько VRAM реально занято
; чужими процессами (браузер, рабочий стол, DLSS). 0 = веса получают больше карты;
; на 12 ГБ с H3 стоит попробовать, если генерация встает на инициализации
nvml_pressure=1
; (правка 1120) запас свободной VRAM держим только через reserve_gb=4.
; Отдельного headroom-флага в V6 не было вовсе (это наш патч 967), и два
; механизма подряд держали лишние гигабайты.
; Если на 8 ГБ не хватает VRAM (OOM/своп) — уменьшить reserve_gb до 3.
vram_headroom=0
; auto = ComfyUI сам решает; 1 = принудительный --fast-disk; 0 = --disable-fast-disk
fast_disk=auto

[comfy]
turbo_lora=
; Пусто = дефолтная diffusion-модель из кода
diffusion_model=
; comfy_dir не задан = ./ComfyUI рядом с программой (старая папка ComfyUI-Easy-Install подхватывается автоматически)

[llm]
custom_mmproj_path=
custom_model_path=
repeat_penalty=1
frequency_penalty=0
presence_penalty=0
min_p=0.05
top_k=40
top_p=0.95
temperature=0.7
sampling_override=0
kv_cache=q4_0
video_vision=0
model=Qwen3.5-9B-Q4_K_M.gguf
max_output_tokens=4096
context_size=25600
device=auto

[ui]
sound_on=1

[stt]
dir=
threads=0
language=ru
model=
enabled=1

[upscale]
enabled=1
port=7890

[models]
extra_paths=[]

[video]
codec=h264
crf=12
nvenc_bitrate=16
